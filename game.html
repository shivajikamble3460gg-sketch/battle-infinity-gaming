
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Dodge | Battle Infinity</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #070b18;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #00f5ff; text-shadow: 0 0 15px #00f5ff; }
p { color: #b9c7e8; }
#game {
  display: block;
  width: min(92vw, 400px);
  height: auto;
  margin: 15px auto;
  border: 2px solid #00f5ff;
  border-radius: 12px;
  background: #10152c;
  touch-action: none;
}
button {
  background: #00eaff;
  color: #06101c;
  border: 0;
  border-radius: 10px;
  padding: 13px 22px;
  margin: 5px;
  font-weight: bold;
  font-size: 16px;
}
.controls { display: flex; justify-content: center; gap: 25px; }
#score { color: #00ff9d; font-size: 20px; }
</style>
</head>
<body>
<h1>🚀 SPACE DODGE</h1>
<p>Move your ship. Dodge the meteors!</p>
<div id="score">Score: 0</div>
<canvas id="game" width="360" height="500"></canvas>
<button id="start">START GAME</button>
<div class="controls">
  <button id="left">⬅ LEFT</button>
  <button id="right">RIGHT ➡</button>
</div>
<p id="message">Tap START GAME to play.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let ship, rocks, score, running, left, right, lastTime, spawn;
let keys = {};

function reset() {
  ship = { x: 180, y: 440, size: 15 };
  rocks = [];
  score = 0;
  spawn = 0;
  lastTime = 0;
  left = false;
  right = false;
  running = true;
  scoreText.textContent = "Score: 0";
  message.textContent = "Dodge the meteors!";
  requestAnimationFrame(loop);
}

function drawShip() {
  ctx.fillStyle = "#00f5ff";
  ctx.beginPath();
  ctx.moveTo(ship.x, ship.y - 17);
  ctx.lineTo(ship.x - 14, ship.y + 13);
  ctx.lineTo(ship.x, ship.y + 7);
  ctx.lineTo(ship.x + 14, ship.y + 13);
  ctx.closePath();
  ctx.fill();
}

function loop(time) {
  if (!running) return;
  const dt = Math.min((time - (lastTime || time)) / 16.67, 2);
  lastTime = time;

  ctx.clearRect(0, 0, 360, 500);
  ctx.fillStyle = "#10152c";
  ctx.fillRect(0, 0, 360, 500);

  for (let i = 0; i < 35; i++) {
    ctx.fillStyle = "#62719a";
    ctx.fillRect((i * 73) % 360, (i * 97) % 500, 2, 2);
  }

  if (left || keys.ArrowLeft) ship.x -= 4 * dt;
  if (right || keys.ArrowRight) ship.x += 4 * dt;
  ship.x = Math.max(18, Math.min(342, ship.x));

  spawn += dt;
  if (spawn > 32) {
    rocks.push({
      x: 15 + Math.random() * 330,
      y: -15,
      r: 9 + Math.random() * 9,
      speed: 2 + Math.random() * 2
    });
    spawn = 0;
  }

  for (const r of rocks) {
    r.y += r.speed * dt;
    ctx.fillStyle = "#ff5577";
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.fill();

    if (Math.hypot(r.x - ship.x, r.y - ship.y) < r.r + 10) {
      running = false;
      message.textContent = "Game Over! Tap START GAME to retry.";
    }
  }

  rocks = rocks.filter(r => r.y < 520);
  drawShip();

  if (running) {
    score += dt;
    scoreText.textContent = "Score: " + Math.floor(score);
    requestAnimationFrame(loop);
  }
}

document.getElementById("start").addEventListener("click", reset);

function holdButton(id, direction) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (direction === "left") left = true;
    else right = true;
  });
  for (const eventName of ["pointerup", "pointerleave", "pointercancel"]) {
    el.addEventListener(eventName, () => {
      if (direction === "left") left = false;
      else right = false;
    });
  }
}
holdButton("left", "left");
holdButton("right", "right");

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

ctx.fillStyle = "#10152c";
ctx.fillRect(0, 0, 360, 500);
drawShip = drawShip;
ship = { x: 180, y: 440, size: 15 };
drawShip();
</script>
</body>
</html>
